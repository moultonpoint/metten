[package]
name = "metten"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
metten-engine = { path = "../crates/engine" }
tauri = { version = "2", features = [] }
tokio = { version = "=1.54.1", features = ["sync", "time", "net", "macros", "rt", "io-util"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
tokio-tungstenite = { version = "=0.30.0", features = ["native-tls"] }
futures-util = { version = "0.3.32", features = ["sink"] }
ed25519-dalek = { version = "=2.2.0", features = ["pem"] }
rsa = { version = "=0.9.10", features = ["sha2", "getrandom"] }
sha2 = "0.10.9"
base64 = "0.22.1"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
libc = "0.2.191"
security-framework-sys = { version = "2.17.0", features = ["OSX_10_15"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
